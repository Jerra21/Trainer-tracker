<style>

r:pointer}tr.click:hover{background:#132238}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#22334b;font-size:12px}.ok{background:#173f32;color:#7ce0b0}.warn{background:#493a18;color:#ffd978}.bad{background:#4c2227;color:#ff9b9b}.blue{background:#173856;color:#8fcaff}.stat{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.pill{padding:8px 10px;border:1px solid var(--line);background:#0c1727;border-radius:9px}.pill b{display:block;font-size:17px}.pill span{font-size:10px;color:var(--muted)}.entry{display:grid;grid-template-columns:1.4fr 1fr 100px 1.3fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.matchentry{grid-template-columns:1.4fr 105px 70px 70px 70px 60px 60px 80px 1.2fr 55px}.notice{padding:11px;border-left:4px solid var(--blue);background:#14253a;border-radius:8px;margin:7px 0}.notice.warn{border-color:var(--yellow)}.notice.bad{border-color:var(--red)}.notice.good{border-color:var(--green)}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:14px;z-index:50}.modal.open{display:flex}.box{width:min(900px,100%);max-height:93vh;overflow:auto;background:var(--p);border:1px solid var(--line);border-radius:17px;padding:18px}.close{border:0;background:#21334c;color:#fff;border-radius:8px;padding:7px 11px;cursor:pointer}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calh{text-align:center;color:var(--muted);font-size:11px}.day{min-height:58px;background:#0d1829;border:1px solid var(--line);border-radius:8px;padding:5px}.day.click{cursor:pointer}.goal{padding:11px;background:#0d1829;border:1px solid var(--line);border-radius:10px;margin:7px 0}.bottom{display:none}
@media(max-width:850px){.side{display:none}.main{margin:0;padding:14px 14px 80px}.top{align-items:flex-start;flex-direction:column}.team{width:100%}.team select{flex:1}.g4,.g3{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.entry,.matchentry{grid-template-columns:1fr 1fr}.entry .name,.matchentry .name{grid-column:1/-1}.bottom{display:flex;position:fixed;z-index:40;bottom:0;left:0;right:0;background:#0b1627;border-top:1px solid var(--line);padding:5px;gap:3px}.bottom button{flex:1;background:0;border:0;color:var(--muted);font-size:10px;padding:5px}.bottom button.active{color:#fff;background:#1a2a41;border-radius:8px}table{font-size:12px}.hideMob{display:none}}
@media(max-width:480px){.g4,.g3{grid-template-columns:1fr}.card{padding:14px}.actions .btn{flex:1}}

/* LIVE WEDSTRIJD ADD-ON */
.live-score{display:flex;align-items:center;justify-content:center;gap:25px;padding:18px;border:1px solid var(--line);border-radius:16px;background:#0b1525;margin-bottom:14px}
.score-team{text-align:center;min-width:130px}.score-team div:first-child{color:var(--muted);font-size:13px}.score{font-size:52px;font-weight:900}
.clock{text-align:center;font-size:42px;font-weight:900;margin:10px}.clock.overtime{color:var(--yellow)}

.live-player{padding:10px;border:1px solid var(--line);border-radius:10px;background:#0d1829}.live-player .actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.live-event{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.live-minute-list{max-height:360px;overflow:auto}

@media(max-width:850px){.live-score{gap:8px}.score-team{min-width:90px}.score{font-size:40px}.live-actions{grid-template-columns:1fr}.player-grid{grid-template-columns:1fr}}
</style></head><body>
<aside class="side"><div class="brand">⚽ U16 Trainer<small>Trainersdashboard V3</small></div><div id="nav" class="nav"></div><hr>
<button class="btn sec sm" onclick="backup()">⬇ Back-up</button> <button class="btn sec sm" onclick="document.querySelector('#imp').click()">⬆ Import</button><input id="imp" type="file" accept=".json" hidden onchange="importDB(event)"></aside>
<main class="main"><div class="top"><h1 id="title">Dashboard</h1><div class="team"><select id="teams" onchange="setTeam(this.value)"></select><button class="btn sm sec" onclick="newTeam()">+ Team</button></div></div><div id="content"></div></main>
<nav id="bottom" class="bottom"></nav><div id="modal" class="modal"><div id="box" class="box"></div></div>

<script>
"use strict";

/* =========================================================
   U16 TRAINER V4
   Standalone HTML / CSS / Vanilla JS / localStorage
   ========================================================= */

const KEY = "u16trainer_v2";
const LEGACY_KEYS = [
  "u16trainer_v1",
  "voetbaltrainer_v1",
  "voetbaltrainer_v2"
];
const DRAFT_T = "u16_draft_training_v4";
const DRAFT_M = "u16_draft_match_v4";

let db = null;
let ui = {
  section: "dashboard",
  editingTraining: null,
  editingMatch: null,
  selectedPlayer: null,
  selectedCalendarDate: null,
  trainingDraft: null,
  matchDraft: null,
  teamFilter: "active",
  calendarMonth: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
  trainingCalendarMonth: new Date(new Date().getFullYear(), new Date().getMonth(), 1)
};
let liveState={match:null,timer:null};

const uid = (prefix="id") => prefix + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,9);
const today = () => new Date().toISOString().slice(0,10);
const clone = x => JSON.parse(JSON.stringify(x));
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const num = (v, d=0) => Number.isFinite(Number(v)) ? Number(v) : d;
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
const fmt = v => v == null ? "—" : Number(v).toFixed(1);
const daysBetween = (a,b) => Math.floor((new Date(b)-new Date(a))/86400000);

function blankDB(){
  return {
    version: 4,
    activeTeamId: "team1",
    teams: [{id:"team1", name:"U16 Selectie", season:"2026/27"}],
    players: [],
    trainings: [],
    matches: [],
    developmentHistory: [],
    settings: {}
  };
}

function normalizePlayer(p, i){
  const x = {...p};
  x.id = x.id || uid("player");
  x.name = x.name || x.naam || `Speler ${i+1}`;
  x.position = x.position || x.positie || "";
  x.archived = !!x.archived;
  x.teamId = x.teamId || db.activeTeamId || "team1";
  x.notes = x.notes ?? x.note ?? "";
  x.goals = Array.isArray(x.goals) ? x.goals : [];
  return x;
}

function normalizeTraining(t){
  const x = {...t};
  x.id = x.id || uid("training");
  x.teamId = x.teamId || db.activeTeamId || "team1";
  x.date = x.date || x.datum || today();
  x.note = x.note ?? "";
  x.rating = x.rating == null || x.rating === "" ? null : num(x.rating, null);
  x.detailed = x.detailed && typeof x.detailed === "object" ? {...x.detailed} : {};
  x.players = Array.isArray(x.players) ? x.players.map(r => ({
    ...r,
    id: r.id || uid("tp"),
    playerId: r.playerId || r.spelerId || "",
    status: r.status || "aanwezig",
    reason: r.reason ?? (r.status === "afwezig met reden" ? (r.note ?? "") : ""),
    note: r.note ?? "",
    rating: r.rating == null || r.rating === "" ? null : num(r.rating, null),
    effort: r.effort == null ? null : num(r.effort,null),
    intensity: r.intensity == null ? null : num(r.intensity,null),
    technique: r.technique == null ? null : num(r.technique,null),
    tactical: r.tactical == null ? null : num(r.tactical,null),
    teamwork: r.teamwork == null ? null : num(r.teamwork,null),
    discipline: r.discipline == null ? null : num(r.discipline,null)
  })) : [];
  return x;
}

function normalizeMatch(m){
  const x = {...m};
  x.id = x.id || uid("match");
  x.teamId = x.teamId || db.activeTeamId || "team1";
  x.date = x.date || x.datum || today();
  x.opponent = x.opponent || x.tegenstander || "";
  x.type = x.type || "Competitie";
  x.ownGoals = num(x.ownGoals ?? x.eigenGoals ?? x.goalsFor,0);
  x.opponentGoals = num(x.opponentGoals ?? x.tegenGoals ?? x.goalsAgainst,0);
  x.teamRating = x.teamRating == null || x.teamRating === "" ? null : num(x.teamRating,null);
  x.teamGood = x.teamGood ?? "";
  x.teamImprove = x.teamImprove ?? "";
  x.note = x.note ?? "";
  x.motmPlayerId = x.motmPlayerId || x.motm || null;

  let rows = Array.isArray(x.players) ? x.players : [];
  /* Support older flat match rows by keeping the match and wrapping its player row. */
  if (!rows.length && x.playerId) rows = [x];

  x.players = rows.map(r => ({
    ...r,
    id: r.id || uid("mp"),
    playerId: r.playerId || r.spelerId || "",
    status: r.status || "not_played",
    minutes: num(r.minutes ?? r.minuten,0),
    goals: num(r.goals,0),
    assists: num(r.assists,0),
    yellow: num(r.yellow ?? r.geleKaart,0),
    red: num(r.red ?? r.rodeKaart,0),
    rating: r.rating == null || r.rating === "" ? null : num(r.rating,null),
    note: r.note ?? ""
  }));
  return x;
}

function migrate(raw){
  const incoming = clone(raw || {});
  const base = blankDB();

  /* Preserve all known and unknown root fields. */
  db = {...base, ...incoming};
  db.version = 4;

  if (!Array.isArray(db.teams) || !db.teams.length){
    db.teams = clone(base.teams);
  }
  db.activeTeamId = db.activeTeamId || db.teams[0].id;

  if (!Array.isArray(db.players)) db.players = [];
  if (!Array.isArray(db.trainings)) db.trainings = [];
  if (!Array.isArray(db.matches)) db.matches = [];
  if (!Array.isArray(db.developmentHistory)) db.developmentHistory = [];

  db.players = db.players.map(normalizePlayer);

  /* If an old export stored one row per player/match, group by matchId where possible. */
  const grouped = [];
  const map = new Map();
  for (const rawM of db.matches){
    const m = normalizeMatch(rawM);
    if (m.matchId && m.playerId && !rawM.players){
      const key = m.matchId;
      if (!map.has(key)){
        map.set(key, {...m, id:key, players:[]});
        grouped.push(map.get(key));
      }
      const target = map.get(key);
      target.players.push(m.players[0]);
    } else {
      grouped.push(m);
    }
  }
  db.matches = grouped;
  db.trainings = db.trainings.map(normalizeTraining);

  /* Keep archived players and old records; only make IDs safe. */
  const seen = new Set();
  for (const p of db.players){
    if (seen.has(p.id)) p.id = uid("player");
    seen.add(p.id);
  }

  return db;
}

function loadDB(){
  let loaded = null;
  const current = localStorage.getItem(KEY);
  if (current){
    try { loaded = JSON.parse(current); } catch(e) {}
  }

  if (!loaded){
    for (const k of LEGACY_KEYS){
      const raw = localStorage.getItem(k);
      if (!raw) continue;
      try {
        loaded = JSON.parse(raw);
        /* Never remove the legacy source. It is retained as a safety copy. */
        localStorage.setItem(k + "_migration_backup", raw);
        break;
      } catch(e) {}
    }
  }

  db = migrate(loaded || blankDB());
  persist();
}

function persist(){
  localStorage.setItem(KEY, JSON.stringify(db));
}

function team(){
  return db.teams.find(t => t.id === db.activeTeamId) || db.teams[0];
}
function players(all=false){
  return db.players.filter(p => p.teamId === db.activeTeamId && (all || !p.archived));
}
function player(id){ return db.players.find(p => p.id === id); }
function teamTrainings(){
  return db.trainings.filter(t => t.teamId === db.activeTeamId).sort((a,b)=>b.date.localeCompare(a.date));
}
function teamMatches(){
  return db.matches.filter(m => m.teamId === db.activeTeamId).sort((a,b)=>b.date.localeCompare(a.date));
}

function saveDrafts(){
  if (ui.trainingDraft) localStorage.setItem(DRAFT_T, JSON.stringify(ui.trainingDraft));
  else localStorage.removeItem(DRAFT_T);
  if (ui.matchDraft) localStorage.setItem(DRAFT_M, JSON.stringify(ui.matchDraft));
  else localStorage.removeItem(DRAFT_M);
}
let draftTimer;
function autosave(){
  clearTimeout(draftTimer);
  draftTimer = setTimeout(saveDrafts, 700);
}

function defaultTrainingDraft(){
  return {
    date: today(),
    rating: "",
    detailed: {effort:"",intensity:"",technique:"",tactical:"",teamwork:"",discipline:""},
    note:"",
    players: players().map(p => ({playerId:p.id,status:"aanwezig",reason:"",note:"",rating:"",effort:"",intensity:"",technique:"",tactical:"",teamwork:"",discipline:""}))
  };
}
function defaultMatchDraft(){
  return {
    date:today(), opponent:"", type:"Competitie", ownGoals:0, opponentGoals:0,
    teamRating:"", teamGood:"", teamImprove:"", note:"", motmPlayerId:"",
    players:players().map(p=>({playerId:p.id,status:"not_played",minutes:0,goals:0,assists:0,yellow:0,red:0,rating:"",note:""}))
  };
}
function restoreDraft(key, fallback){
  try {
    const raw = localStorage.getItem(key);
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return fallback();
}

/* ---------- Rendering ---------- */

function setSection(s){
  ui.section=s;
  ui.editingTraining=null;
  ui.editingMatch=null;
  render();
}
function render(){
  const root = document.getElementById("app") || document.body;
  root.innerHTML = shell();
  bindShell();
  const main = document.getElementById("view");
  if (ui.section==="dashboard") main.innerHTML=dashboardView();
  if (ui.section==="training") main.innerHTML=trainingView();
  if (ui.section==="match") main.innerHTML=matchView();
  if (ui.section==="players") main.innerHTML=playersView();
  if (ui.section==="history") main.innerHTML=historyView();
  bindView();
}

function shell(){
  const nav = [
    ["dashboard","Dashboard","⌂"],["training","Training","▣"],["match","Wedstrijd","⚽"],
    ["players","Spelers","♟"],["history","Historie","↺"]
  ];
  return `
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-ball">⚽</span><div><b>U16 Trainer</b><small>${esc(team()?.name||"Team")}</small></div></div>
      <div class="team-switch">
        <label>Team</label>
        <select id="teamSelect">${db.teams.map(t=>`<option value="${esc(t.id)}" ${t.id===db.activeTeamId?"selected":""}>${esc(t.name)}</option>`).join("")}</select>
        <button class="ghost small" id="addTeam">+ Team</button>
      </div>
      <nav>${nav.map(([id,label,icon])=>`<button class="nav-btn ${ui.section===id?"active":""}" data-nav="${id}"><span>${icon}</span>${label}</button>`).join("")}</nav>
      <div class="side-bottom">
        <button class="ghost" id="backupBtn">⬇ Back-up</button>
        <label class="ghost import-label">⬆ Import<input type="file" id="importFile" accept=".json,application/json" hidden></label>
        <button class="danger ghost" id="resetBtn">Reset data</button>
      </div>
    </aside>
    <main class="main"><div class="mobile-head"><b>⚽ U16 Trainer</b><button class="ghost" id="mobileBackup">Back-up</button></div><div id="view"></div><div id="liveModalRoot"></div></main>
    <nav class="mobile-nav">${nav.map(([id,label,icon])=>`<button class="${ui.section===id?"active":""}" data-nav="${id}"><span>${icon}</span><small>${label}</small></button>`).join("")}</nav>
  </div>`;
}

function card(title, body, cls=""){
  return `<section class="card ${cls}"><div class="card-head"><h3>${title}</h3></div>${body}</section>`;
}
function kpi(label,value,sub=""){
  return `<div class="kpi"><small>${label}</small><strong>${value}</strong><span>${sub}</span></div>`;
}
function empty(text){ return `<div class="empty">${text}</div>`; }

function dashboardView(){
  const ps=players(), ts=teamTrainings(), ms=teamMatches();
  const att = attendanceStats();
  const ratings = ms.flatMap(m=>m.players.map(r=>num(r.rating,null))).filter(v=>v!=null);
  const motm = {};
  ms.forEach(m=>{if(m.motmPlayerId) motm[m.motmPlayerId]=(motm[m.motmPlayerId]||0)+1;});
  const attention = attentionSignals();

  return `
  <div class="page-head"><div><span class="eyebrow">${esc(team()?.season||"")}</span><h1>Dashboard</h1><p>Snelle team- en spelersinzichten.</p></div><div class="head-actions"><button class="primary" data-nav="training">+ Training</button><button class="secondary" data-nav="match">+ Wedstrijd</button></div></div>
  <div class="kpi-grid">
    ${kpi("Spelers",ps.length, "actief")}
    ${kpi("Aanwezigheid",att.percent==null?"—":att.percent+"%", "gemiddeld")}
    ${kpi("Trainingen",ts.length,"geregistreerd")}
    ${kpi("Wedstrijden",ms.length,"geregistreerd")}
    ${kpi("Gem. matchrating",ratings.length?fmt(avg(ratings)):"—","/ 10")}
  </div>

  <div class="grid-2">
    ${card("Aandacht", attention.length ? attention.slice(0,8).map(a=>`<div class="signal ${a.level}"><b>${esc(a.title)}</b><span>${esc(a.text)}</span></div>`).join("") : empty("Geen aandachtspunten gevonden."))}
    ${card("Ontwikkeling", developmentBlock())}
  </div>

  ${card("Aanwezigheid per speler", dashboardAttendanceCalendar())}

  ${card("Speelminuten per speler", `<div class="table-wrap"><table><thead><tr><th>Speler</th><th>Totaal gespeelde minuten</th><th>Gemiddeld per gespeelde wedstrijd</th><th>Wedstrijden</th></tr></thead><tbody>
  ${ps.map(p=>{
    const total=sumMinutes(p.id);
    const games=teamMatches().filter(m=>(m.players||[]).some(r=>r.playerId===p.id && (num(r.minutes)>0 || r.status==="basis" || r.status==="ingevallen"))).length;
    const average=games?(total/games).toFixed(1):"0.0";
    return `<tr><td><b>${esc(p.name)}</b><br><span class="muted">${esc(p.position||"")}</span></td><td><b>${Math.round(total)} min</b></td><td>${average} min</td><td>${games}</td></tr>`;
  }).join("")||`<tr><td colspan="4">Nog geen spelers.</td></tr>`}
  </tbody></table></div>`)}
  <div class="grid-2">
    ${card("MOTM leaderboard", motmLeaderboard(motm))}
    ${card("Trends", trendBlock())}
  </div>
  <div class="grid-2">
    ${card("Recente trainingen", ts.slice(0,5).map(t=>`<div class="list-row"><b>${esc(t.date)}</b><span>${t.rating?`Team ${fmt(t.rating)}/5`:"Geen teamrating"}</span><button class="linkbtn" data-edit-training="${t.id}">Bewerk</button></div>`).join("")||empty("Nog geen trainingen."))}
    ${card("Recente wedstrijden", ms.slice(0,5).map(m=>`<div class="list-row"><b>${esc(m.date)} · ${esc(m.opponent||"—")}</b><span>${m.ownGoals}-${m.opponentGoals}</span><button class="linkbtn" data-edit-match="${m.id}">Bewerk</button></div>`).join("")||empty("Nog geen wedstrijden."))}
  </div>`;
}

function dashboardAttendanceCalendar(){
  const d=ui.calendarMonth || new Date(new Date().getFullYear(),new Date().getMonth(),1);
  const y=d.getFullYear(), m=d.getMonth(), days=new Date(y,m+1,0).getDate();
  const monthName=d.toLocaleString("nl-NL",{month:"long",year:"numeric"});
  const ts=teamTrainings();

  let head=`<div class="calendar-toolbar">
    <button class="ghost small" id="calPrev">← Vorige</button>
    <b>${esc(monthName.charAt(0).toUpperCase()+monthName.slice(1))}</b>
    <button class="ghost small" id="calNext">Volgende →</button>
  </div>

    <span><i class="legend-dot present"></i>Aanwezig</span>
    <span><i class="legend-dot late"></i>Te laat</span>
    <span><i class="legend-dot absent"></i>Afwezig</span>
    <span><i class="legend-dot reason"></i>Afwezig met reden</span>
    <span><i class="legend-dot empty"></i>Geen training</span>
  </div>`;

  let grid=`<div class="attendance-calendar-wrap"><table class="attendance-calendar"><thead><tr><th>Speler</th>`;
  for(let day=1;day<=days;day++){
    const date=`${y}-${String(m+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const t=ts.find(x=>x.date===date);
    grid+=`<th class="${t?"training-day":""}" title="${t?"Training geregistreerd":"Geen training"}">${day}</th>`;
  }
  grid+=`<th>%</th></tr></thead><tbody>`;

  players().forEach(p=>{
    const pa=playerAttendance(p.id);
    grid+=`<tr><td class="player-name-cell"><b>${esc(p.name)}</b></td>`;
    for(let day=1;day<=days;day++){
      const date=`${y}-${String(m+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
      const t=ts.find(x=>x.date===date);
      const r=t?.players.find(x=>x.playerId===p.id);
      const st=r?.status||"";
      const cls=st==="aanwezig"?"present":st==="te laat"?"late":st==="afwezig met reden"?"reason":st==="afwezig"?"absent":"empty";
      const letter=st==="aanwezig"?"✓":st==="te laat"?"L":st==="afwezig"?"A":st==="afwezig met reden"?"R":"";
      grid+=`<td><button class="att-cell ${cls}" data-calendar="${date}" data-calendar-player="${p.id}" title="${st?esc(st):"Geen training"}">${letter}</button></td>`;
    }
    grid+=`<td class="percent-cell"><b>${pa==null?"—":pa+"%"}</b></td></tr>`;
  });
  grid+=`</tbody></table></div>`;
  return head+grid;
}

function attendanceStats(){
  const rows=[];
  teamTrainings().forEach(t=>t.players.forEach(r=>rows.push(r)));
  const relevant=rows.filter(r=>r.status!=="afwezig");
  const total=rows.length;
  return {percent:total?Math.round(relevant.length/total*100):null};
}

function developmentBlock(){

  ps.forEach(p=>(p.goals||[]).forEach(g=>{if(g.status!=="Behaald") goals.push({p,g});}));
  return goals.length ? goals.slice(0,6).map(({p,g})=>`<div class="list-row"><div><b>${esc(p.name)}</b><small>${esc(g.title||g.text||"Doel")}</small></div><span>${esc(g.status||"Niet gestart")}</span></div>`).join("") : empty("Geen actieve ontwikkelingsdoelen.");
}
function motmLeaderboard(map){
  const rows=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,8);
  return rows.length ? rows.map(([id,n],i)=>`<div class="list-row"><b>#${i+1} ${esc(player(id)?.name||"Onbekend")}</b><span>${n}× MOTM</span></div>`).join("") : empty("Nog geen MOTM.");

function trendBlock(){
  const ps=players();
  const vals=ps.map(p=>({p, v:playerMatchRatings(p.id)})).filter(x=>x.v.length>=2);
  if(!vals.length) return empty("Nog te weinig wedstrijddata voor trends.");
  return vals.slice(0,8).map(x=>{
    const a=x.v.slice(-3), last=a[a.length-1], prev=a.length>1?a[a.length-2]:last;
    const delta=last-prev;
    return `<div class="trend-row"><b>${esc(x.p.name)}</b><span>${fmt(last)} <i class="${delta>=0?"up":"down"}">${delta>=0?"▲":"▼"} ${Math.abs(delta).toFixed(1)}</i></span></div>`;
  }).join("");
}

/* ---------- Stats / attention ---------- */

function playerAttendance(id){
  const rows=teamTrainings().flatMap(t=>t.players.filter(r=>r.playerId===id));
  if(!rows.length) return null;
  return Math.round(rows.filter(r=>r.status==="aanwezig"||r.status==="te laat").length/rows.length*100);
}
function playerMatchRatings(id){return teamMatches().flatMap(m=>m.players.filter(r=>r.playerId===id).map(r=>num(r.rating,null))).filter(v=>v!=null);}
function playerTrainingRatings(id){return teamTrainings().flatMap(t=>t.players.filter(r=>r.playerId===id).map(r=>num(r.rating,null))).filter(v=>v!=null);}
function sumMinutes(id){return teamMatches().reduce((s,m)=>s+num(m.players.find(r=>r.playerId===id)?.minutes,0),0);}
function countStarts(id){return teamMatches().filter(m=>m.players.find(r=>r.playerId===id)?.status==="starter").length;}
function countSubs(id){return teamMatches().filter(m=>m.players.find(r=>r.playerId===id)?.status==="sub").length;}
function sumGoals(id){return teamMatches().reduce((s,m)=>s+num(m.players.find(r=>r.playerId===id)?.goals,0),0);}
function sumAssists(id){return teamMatches().reduce((s,m)=>s+num(m.players.find(r=>r.playerId===id)?.assists,0),0);}

function attentionSignals(){
  const out=[];
  players().forEach(p=>{
    const a=playerAttendance(p.id);
    if(a!=null && a<70) out.push({level:"bad",title:p.name,text:`Aanwezigheid ${a}% — onder 70%.`});
    else if(a!=null && a<80) out.push({level:"warn",title:p.name,text:`Aanwezigheid ${a}% — onder 80%.`});

    const rows=teamTrainings().map(t=>t.players.find(r=>r.playerId===p.id)?.status).filter(Boolean);
    let streak=0; for(let i=0;i<rows.length;i++){if(rows[i]==="afwezig"||rows[i]==="afwezig met reden")streak++;else break;}
    if(streak>=2) out.push({level:"bad",title:p.name,text:`${streak} trainingen achter elkaar afwezig.`});

    const mr=playerMatchRatings(p.id);
    if(mr.length>=3){
      const a=avg(mr.slice(-2)), b=avg(mr.slice(-4,-2));
      if(b!=null && a < b-0.6) out.push({level:"warn",title:p.name,text:`Matchrating daalt (${fmt(b)} → ${fmt(a)}).`});
      if(b!=null && a > b+0.6) out.push({level:"good",title:p.name,text:`Matchrating verbetert (${fmt(b)} → ${fmt(a)}).`});
    }

    (p.goals||[]).filter(g=>g.status!=="Behaald").forEach(g=>{
      const age=daysBetween(g.createdAt||today(),today());
      if(age>=42) out.push({level:"warn",title:p.name,text:`Doel "${g.title||g.text}" loopt al ${Math.floor(age/7)} weken.`});
    });
  });
  return out;
}

function beginLiveMatch(){
  const selected=[...document.querySelectorAll(".live-starter:checked")].map(x=>x.value);
  if(selected.length!==11){alert("Selecteer precies 11 basisspelers.");return;}
  const lm=liveState.match;

  lm.type=document.getElementById("lType").value;lm.halfLength=Math.max(1,+document.getElementById("lHalf").value||40);

  lm.starterIds=[...selected];lm.enteredIds=[...selected];selected.forEach(id=>lm.minutes[id]=0);
  lm.status="running";lm.half=1;lm.elapsed=0;lm.lastTick=Date.now();startLiveTimer();renderLiveMatch();
}
function startLiveTimer(){stopLiveTimer();liveState.timer=setInterval(tickLiveMatch,1000)}
function stopLiveTimer(){if(liveState.timer){clearInterval(liveState.timer);liveState.timer=null}}
function elapsedLiveMinutes(){
  const lm=liveState.match;if(!lm)return 0;let ms=lm.elapsed;
  if(lm.status==="running"&&lm.lastTick)ms+=Date.now()-lm.lastTick;return ms/60000;
}
function tickLiveMatch(){
  const lm=liveState.match;if(!lm||lm.status!=="running")return;
  const now=Date.now(),delta=now-(lm.lastTick||now);lm.elapsed+=delta;lm.lastTick=now;
  (lm.field||[]).forEach(id=>lm.minutes[id]=(lm.minutes[id]||0)+delta/60000);renderLiveMatch();
}
function pauseLiveMatch(){
  const lm=liveState.match;if(!lm)return;
  if(lm.status==="running"){tickLiveMatch();lm.status="paused";lm.lastTick=null}
  else if(lm.status==="paused"){lm.status="running";lm.lastTick=Date.now()}
  renderLiveMatch();
}
function finishHalfLive(){
  const lm=liveState.match;if(!lm)return;
  if(lm.status==="running")tickLiveMatch();
  if(lm.half===1){lm.half=2;lm.elapsed=0;lm.lastTick=null;lm.status="paused";renderLiveMatch()}
  else{lm.status="finished";stopLiveTimer();openLiveSummary()}
}
function liveGoal(side,playerId=null){
  const lm=liveState.match;if(!lm)return;const minute=Math.floor(elapsedLiveMinutes());
  if(side==="own")lm.ownGoals++;else lm.opponentGoals++;
  lm.events.push({id:uid("event"),type:"goal",side,playerId,minute});renderLiveMatch();
}

    red:+document.querySelector(`.liveRed[data-id="${id}"]`)?.value||0,rating:+document.querySelector(`.liveRating[data-id="${id}"]`)?.value||null,note:document.querySelector(`.liveNote[data-id="${id}"]`)?.value||""};});
  db.matches.push({id:uid("match"),teamId:lm.teamId,date:lm.date,opponent:lm.opponent,type:lm.type,ownGoals:lm.ownGoals,opponentGoals:lm.opponentGoals,result:resultLabel(lm.ownGoals,lm.opponentGoals),

  ui.calendarMonth=new Date(d.getFullYear(),d.getMonth()+delta,1);
  render();
}

  document.getElementById("playerCalNext")?.addEventListener("click",()=>shiftCalendar(1));
  document.getElementById("trainingCalPrev")?.addEventListener("click",()=>{
    const d=ui.trainingCalendarMonth || new Date(new Date().getFullYear(),new Date().getMonth(),1);
    ui.trainingCalendarMonth=new Date(d.getFullYear(),d.getMonth()-1,1); render();
  });

  document.getElementById("saveMatch")?.addEventListener("click",saveMatch);

function readTrainingDraftOnly(){
  try{
    const d=ui.trainingDraft||defaultTrainingDraft();
    const date=document.getElementById("tDate"); if(date)d.date=date.value;
    const r=document.getElementById("tRating"); if(r)d.rating=r.value;
    const n=document.getElementById("tNote"); if(n)d.note=n.value;
    ui.trainingDraft=d; autosave();
  }catch(e){}
}
function readMatchDraftOnly(){
  try{
    const d=ui.matchDraft||defaultMatchDraft();
    const date=document.getElementById("mDate");if(date)d.date=date.value;
    const o=document.getElementById("mOpponent");if(o)d.opponent=o.value;
    ui.matchDraft=d;autosave();
  }catch(e){}
}
function toggleReasonFields(){
  document.querySelectorAll("tr[data-tp]").forEach(row=>{
    const s=row.querySelector(".tp-status"),r=row.querySelector(".tp-reason");
    const show=s?.value==="afwezig met reden";
    if(r){r.disabled=!show;r.placeholder=show?"Reden van afwezigheid":"—";}
  });
}
function calendarClick(date){
  const rec=teamTrainings().find(t=>t.date===date);
  if(rec){
    ui.editingTraining=rec.id;ui.trainingDraft=clone(rec);ui.section="training";render();
  } else {
    ui.trainingDraft=defaultTrainingDraft();ui.trainingDraft.date=date;ui.section="training";render();
  }
}

function resetData(){
  if(!confirm("Weet je het zeker? Dit verwijdert de huidige app-data. Maak eerst een back-up als je twijfelt."))return;
  localStorage.removeItem(KEY);localStorage.removeItem(DRAFT_T);localStorage.removeItem(DRAFT_M);
  db=blankDB();persist();ui={section:"dashboard",editingTraining:null,editingMatch:null,selectedPlayer:null,selectedCalendarDate:null,trainingDraft:null,matchDraft:null,teamFilter:"active",calendarMonth:new Date(new Date().getFullYear(),new Date().getMonth(),1),trainingCalendarMonth:new Date(new Date().getFullYear(),new Date().getMonth(),1)};render();
}
function downloadJSON(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`u16-trainer-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importJSON(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const imported=JSON.parse(reader.result);
      if(!imported || typeof imported!=="object")throw Error();
      const old=localStorage.getItem(KEY);
      if(old)localStorage.setItem(KEY+"_before_import_"+Date.now(),old);
      db=migrate(imported);persist();render();alert("Import gelukt. De vorige lokale data is als veiligheidskopie bewaard.");
    }catch(e){alert("Import mislukt: ongeldig JSON-bestand.");}
  };
  reader.readAsText(file);
}


/* Delegated fallback: makes profile goal actions reliable even after nested re-renders. */
document.addEventListener("click", (e)=>{
  const goal=e.target.closest("#addGoal");
  if(goal){
    e.preventDefault();
    if(ui.selectedPlayer) addGoal(ui.selectedPlayer);
    return;
  }
  const tcal=e.target.closest("[data-training-calendar]");
  if(tcal){
    e.preventDefault();
    calendarClick(tcal.dataset.trainingCalendar);
    return;
  }
  const cal=e.target.closest("[data-calendar]");
  if(cal){
    e.preventDefault();
    calendarClick(cal.dataset.calendar);
    return;
  }
});

.player-modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.68);display:grid;place-items:center;padding:18px;z-index:50}
.player-modal{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 20px 70px rgba(0,0,0,.45)}
.player-modal h3{margin:0 0 5px}.player-modal p{margin:0 0 15px;color:var(--muted);font-size:12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}

@media(max-width:900px){.sidebar{display:none}.mobile-head{height:55px;padding:12px 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;background:#09131d;z-index:5}.page-head{padding:22px 15px 15px;display:block}.head-actions{margin-top:14px}.kpi-grid{padding:0 15px 12px;grid-template-columns:repeat(2,1fr)}.grid-2{padding:0 15px 12px;grid-template-columns:1fr}.calendar-card{margin:0 15px 12px}.player-grid{grid-template-columns:1fr}.form-grid,.rating-grid{grid-template-columns:1fr}.mobile-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#09131d;border-top:1px solid var(--line);z-index:10;padding:5px}.mobile-nav button{background:transparent;border:0;color:var(--muted);padding:5px}.mobile-nav button.active{color:var(--accent)}.mobile-nav span,.mobile-nav small{display:block}.mobile-nav span{font-size:17px}.mobile-nav small{font-size:8px}.main{padding-bottom:68px}.calendar{gap:3px}.cal-cell{min-height:47px;padding:5px;font-size:11px}.stat-strip{grid-template-columns:repeat(5,1fr)}}
`;
